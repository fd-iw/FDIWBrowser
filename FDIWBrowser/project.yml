name: FDIWBrowser

options:
  bundleIdPrefix: cc.fdiw
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.35.0"

targets:
  FDIWBrowser:
    type: application
    platform: iOS
    deploymentTarget: "15.0"

    sources:
      - path: Sources

    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: FDIWBrowser
        CFBundleDisplayName: FDIW Browser
        CFBundleIdentifier: cc.fdiw.browser
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allows plain http:// pages to load. Drop this if you only browse https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.fdiw.browser
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
